services:
  ai-firewall:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Leave empty to use the built-in mock model
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    volumes:
      - firewall-data:/app/data

volumes:
  firewall-data:
